name: Cron - Daily IST

on:
  schedule:
    # data-retention 3:00 AM IST = 21:30 UTC
    - cron: "30 21 * * *"
    # baseline-freeze 9:00 AM IST = 03:30 UTC
    - cron: "30 3 * * *"
    # morning-brief 8:00 AM IST = 02:30 UTC
    - cron: "30 2 * * *"
    # eod-summary 7:00 PM IST = 13:30 UTC
    - cron: "30 13 * * *"
    # neodove-report 12:30 AM IST = 19:00 UTC (reports yesterday)
    - cron: "0 19 * * *"
  workflow_dispatch:

jobs:
  baseline-freeze:
    runs-on: ubuntu-latest
    steps:
      - name: baseline-freeze (capture sent-estimate snapshot for today)
        run: |
          curl -fsS -X POST "${{ secrets.WORKER_URL }}/api/runner/estimates/baseline" -H "Authorization: Bearer ${{ secrets.SHARED_SECRET }}" || true

  data-retention:
    runs-on: ubuntu-latest
    steps:
      - name: data-retention
        run: |
          curl -fsS -X POST "${{ secrets.WORKER_URL }}/api/trigger/data-retention" -H "Authorization: Bearer ${{ secrets.SHARED_SECRET }}" || true

  morning-brief:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: morning-brief (heavy AI on runner)
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          SHARED_SECRET: ${{ secrets.SHARED_SECRET }}
          OMNIROUTE_BASE_URL: ${{ secrets.OMNIROUTE_BASE_URL }}
          OMNIROUTE_API_KEY: ${{ secrets.OMNIROUTE_API_KEY }}
          OMNIROUTE_MODEL: ${{ secrets.OMNIROUTE_MODEL }}
        run: node scripts/morning-brief-runner.js

  eod-summary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: eod-summary (heavy AI on runner)
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          SHARED_SECRET: ${{ secrets.SHARED_SECRET }}
          OMNIROUTE_BASE_URL: ${{ secrets.OMNIROUTE_BASE_URL }}
          OMNIROUTE_API_KEY: ${{ secrets.OMNIROUTE_API_KEY }}
          OMNIROUTE_MODEL: ${{ secrets.OMNIROUTE_MODEL }}
        run: node scripts/eod-summary-runner.js

  neodove-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: neodove-report (yesterday's telecaller call report)
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          SHARED_SECRET: ${{ secrets.SHARED_SECRET }}
          NEODOVE_USER_IDS: ${{ secrets.NEODOVE_USER_IDS }}
        run: node scripts/neodove-report-runner.js