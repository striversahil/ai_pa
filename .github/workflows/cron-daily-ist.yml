name: Cron - Daily IST

on:
  schedule:
    # data-retention 3:00 AM IST = 21:30 UTC
    - cron: "30 21 * * *"
    # baseline-freeze 1:00 AM IST = 19:30 UTC (daily reset anchor)
    - cron: "30 19 * * *"
    # morning-brief 8:00 AM IST = 02:30 UTC
    - cron: "30 2 * * *"
    # eod-summary 7:00 PM IST = 13:30 UTC
    - cron: "30 13 * * *"
    # neodove-report 12:30 AM IST = 19:00 UTC (reports yesterday)
    - cron: "0 19 * * *"
  workflow_dispatch:
    inputs:
      neodove_backfill_days:
        description: "Neodove: backfill N past days (1 = yesterday only)"
        required: false
        default: ""

# Each job only runs at its own scheduled slot — GH triggers ALL jobs on EVERY cron,
# so without these guards the baseline would re-freeze at random times of day.
jobs:
  baseline-freeze:
    if: github.event.schedule == '30 19 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: baseline-freeze (capture sent-estimate snapshot for today)
        run: |
          curl -fsS -X POST "${{ secrets.WORKER_URL }}/api/runner/estimates/baseline" -H "Authorization: Bearer ${{ secrets.SHARED_SECRET }}" || true

  data-retention:
    if: github.event.schedule == '30 21 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: data-retention
        run: |
          curl -fsS -X POST "${{ secrets.WORKER_URL }}/api/trigger/data-retention" -H "Authorization: Bearer ${{ secrets.SHARED_SECRET }}" || true

  morning-brief:
    if: github.event.schedule == '30 2 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: morning-brief (heavy AI on runner)
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          SHARED_SECRET: ${{ secrets.SHARED_SECRET }}
          OMNIROUTE_BASE_URL: ${{ secrets.OMNIROUTE_BASE_URL }}
          OMNIROUTE_API_KEY: ${{ secrets.OMNIROUTE_API_KEY }}
          OMNIROUTE_MODEL: ${{ secrets.OMNIROUTE_MODEL }}
        run: node scripts/morning-brief-runner.js

  eod-summary:
    if: github.event.schedule == '30 13 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: eod-summary (heavy AI on runner)
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          SHARED_SECRET: ${{ secrets.SHARED_SECRET }}
          OMNIROUTE_BASE_URL: ${{ secrets.OMNIROUTE_BASE_URL }}
          OMNIROUTE_API_KEY: ${{ secrets.OMNIROUTE_API_KEY }}
          OMNIROUTE_MODEL: ${{ secrets.OMNIROUTE_MODEL }}
        run: node scripts/eod-summary-runner.js

  neodove-report:
    if: github.event.schedule == '0 19 * * *' || (github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: neodove-report (yesterday's telecaller call report, or N-day backfill)
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          SHARED_SECRET: ${{ secrets.SHARED_SECRET }}
          NEODOVE_USER_IDS: ${{ secrets.NEODOVE_USER_IDS }}
          BACKFILL_DAYS: ${{ github.event.inputs.neodove_backfill_days }}
        run: |
          if [ -n "$BACKFILL_DAYS" ]; then
            echo "backfilling last $BACKFILL_DAYS days"
            for i in $(seq 1 "$BACKFILL_DAYS"); do
              d=$(date -d "-$i days" +%F)
              echo "--- $d ---"
              node scripts/neodove-report-runner.js "$d" || echo "::warning::backfill failed for $d"
            done
          else
            node scripts/neodove-report-runner.js
          fi