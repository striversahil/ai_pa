name: Cron - Daily IST

on:
  # Dispatched ONLY by the Cloudflare Worker cron router (src/worker/cron.ts →
  # workflow_dispatch) at 02:30 / 13:30 / 15:30 / 19:30 / 21:30 UTC — one slot
  # per job family. Native schedule removed — GitHub's own scheduler is
  # unreliable and would double-fire.
  # The Worker passes `inputs.slot` (HH:MM of the slot); each job runs ONLY on
  # its slot. Manual dispatch defaults slot to 'all' so every job runs.
  workflow_dispatch:
    inputs:
      slot:
        description: "Daily slot HH:MM (02:30, 13:30, 15:30, 19:30, 21:30). 'all' runs every job."
        required: false
        default: "all"
      neodove_backfill_days:
        description: "Neodove: backfill N past days (1 = yesterday only)"
        required: false
        default: ""
      run_neodove:
        description: "Run NeoDove-backed jobs (neodove-report). Worker sets false 9PM-9AM IST."
        type: boolean
        default: true

# Each job only runs on its own slot — the Worker fires this workflow 5×/day,
# so without these guards every job would run 5×/day.
concurrency:
  group: cron-daily-ist
  cancel-in-progress: true

jobs:
  baseline-freeze:
    # 19:30 UTC = 01:00 IST — capture sent-estimate snapshot for the new day.
    if: github.event.inputs.slot == 'all' || github.event.inputs.slot == '19:30'
    runs-on: ubuntu-latest
    steps:
      - name: baseline-freeze (capture sent-estimate snapshot for today)
        run: |
          curl -fsS -X POST "${{ secrets.WORKER_URL }}/api/runner/estimates/baseline" -H "Authorization: Bearer ${{ secrets.SHARED_SECRET }}" || true

  data-retention:
    # 21:30 UTC = 03:00 IST — purge messages older than 90 days.
    if: github.event.inputs.slot == 'all' || github.event.inputs.slot == '21:30'
    runs-on: ubuntu-latest
    steps:
      - name: data-retention
        run: |
          curl -fsS -X POST "${{ secrets.WORKER_URL }}/api/trigger/data-retention" -H "Authorization: Bearer ${{ secrets.SHARED_SECRET }}" || true

  telecalling-distribution:
    # 8:00 AM IST round-robin rotation: every active "sent" estimate is dealt
    # across active telecallers (Estimate.assignedTelecallerId is the single
    # source of truth). Synchronous on purpose — ?async=1 relies on a Durable
    # Object alarm that has proven unreliable for this automation.
    if: github.event.inputs.slot == 'all' || github.event.inputs.slot == '02:30'
    runs-on: ubuntu-latest
    steps:
      - name: telecalling round-robin distribution
        run: |
          curl -fsS -X POST "${{ secrets.WORKER_URL }}/api/trigger/telecalling" -H "Authorization: Bearer ${{ secrets.SHARED_SECRET }}"

  telecalling-eod-deduction:
    # 9:00 PM IST end-of-day remark deduction: every red-risk (unsatisfactory)
    # estimate currently held costs its holder −10 (one charge per estimate per
    # day, zombies/locked/skipped excluded). Re-poaching is switched OFF —
    # holders keep everything; this run scores only, never moves estimates.
    if: github.event.inputs.slot == 'all' || github.event.inputs.slot == '15:30'
    runs-on: ubuntu-latest
    steps:
      - name: telecalling EOD remark deduction
        run: |
          curl -fsS -X POST "${{ secrets.WORKER_URL }}/api/trigger/telecalling/eod" -H "Authorization: Bearer ${{ secrets.SHARED_SECRET }}"

  morning-brief:
    # 02:30 UTC = 08:00 IST — morning briefing.
    if: github.event.inputs.slot == 'all' || github.event.inputs.slot == '02:30'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: morning-brief (heavy AI on runner)
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          SHARED_SECRET: ${{ secrets.SHARED_SECRET }}
          GROQ_API_KEYS: ${{ secrets.GROQ_API_KEYS }}
        run: node scripts/morning-brief-runner.js

  eod-summary:
    # 13:30 UTC = 19:00 IST — end-of-day summary.
    if: github.event.inputs.slot == 'all' || github.event.inputs.slot == '13:30'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: eod-summary (heavy AI on runner)
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          SHARED_SECRET: ${{ secrets.SHARED_SECRET }}
          GROQ_API_KEYS: ${{ secrets.GROQ_API_KEYS }}
        run: node scripts/eod-summary-runner.js

  neodove-report:
    # 13:30 UTC = 19:00 IST — the only daily slot inside ops hours, so the
    # run_neodove quiet-hours gate passes. Yesterday's report + N-day backfill.
    if: (github.event.inputs.slot == 'all' || github.event.inputs.slot == '13:30') && github.event.inputs.run_neodove != 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: neodove-report (yesterday's telecaller call report, or N-day backfill)
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          SHARED_SECRET: ${{ secrets.SHARED_SECRET }}
          NEODOVE_USER_IDS: ${{ secrets.NEODOVE_USER_IDS }}
          BACKFILL_DAYS: ${{ github.event.inputs.neodove_backfill_days }}
        run: |
          if [ -n "$BACKFILL_DAYS" ]; then
            echo "backfilling last $BACKFILL_DAYS days"
            for i in $(seq 1 "$BACKFILL_DAYS"); do
              d=$(date -d "-$i days" +%F)
              echo "--- $d ---"
              node scripts/neodove-report-runner.js "$d" || echo "::warning::backfill failed for $d"
            done
          else
            node scripts/neodove-report-runner.js
          fi