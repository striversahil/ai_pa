# Builds the Auto Dialer APK on GitHub's servers, so no local JDK/SDK/Gradle is needed.
# Runs on every push that touches android/Auto-Dialer, or manually (Actions → Android APK → Run workflow).
# The APK is attached to the run as the artifact "auto-dialer-apk" (kept 30 days).
#
# Signing: if the secret ANDROID_DEBUG_KEYSTORE_BASE64 is set, every build is signed with that
# same key, so a new APK installs over the old one without uninstalling (data kept).
# Without it, each run gets a random key and phones must uninstall first. See android/Auto-Dialer/README.md.
name: Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/Auto-Dialer/**'
      - '.github/workflows/android-apk.yml'

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write   # publish the auto-dialer-latest release

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android/Auto-Dialer
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Use the shared signing key
        id: key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            mkdir -p ~/.android
            echo "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
            echo "Signing with the shared key."
            echo "stable=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::ANDROID_DEBUG_KEYSTORE_BASE64 not set: APK signed with a throwaway key (uninstall before installing)."
            echo "stable=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build APK + unit tests
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          bash ./gradlew --no-daemon assembleDebug testDebugUnitTest

      - name: Name the APK by version
        id: apk
        run: |
          v=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          cp app/build/outputs/apk/debug/app-debug.apk "auto-dialer-$v.apk"
          echo "file=android/Auto-Dialer/auto-dialer-$v.apk" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: auto-dialer-apk
          path: ${{ steps.apk.outputs.file }}
          retention-days: 30

      # Rolling "latest" release: fixed public links that Founder OS (Controller → Auto Dialer →
      # Download app) reads. Only main and the auto-dialer feature branches publish.
      - name: Publish as the latest app release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/feat/auto-dialer')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          STABLE_KEY: ${{ steps.key.outputs.stable }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk auto-dialer.apk
          name=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          code=$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts)
          size=$(stat -c %s auto-dialer.apk)
          printf '{"versionName":"%s","versionCode":%s,"sizeBytes":%s,"stableKey":%s,"commit":"%s","branch":"%s","builtAt":"%s","runUrl":"%s"}\n' \
            "$name" "$code" "$size" "${STABLE_KEY:-false}" "$GITHUB_SHA" "$GITHUB_REF_NAME" "$(date -u +%FT%TZ)" \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > auto-dialer.json
          notes="Auto Dialer $name (code $code) · ${GITHUB_REF_NAME}@${GITHUB_SHA::7}. Rebuilt on every push; download from Founder OS → Sales → Controller → Auto Dialer."
          gh release view auto-dialer-latest >/dev/null 2>&1 || \
            gh release create auto-dialer-latest --title "Auto Dialer (latest build)" --notes "$notes" --target "$GITHUB_SHA" --latest=false
          gh release upload auto-dialer-latest auto-dialer.apk auto-dialer.json --clobber
          gh release edit auto-dialer-latest --notes "$notes"
