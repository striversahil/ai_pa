name: Cron - Every 5 min

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  whatsapp-digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: whatsapp-digest (heavy AI on runner)
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          SHARED_SECRET: ${{ secrets.SHARED_SECRET }}
          OMNIROUTE_BASE_URL: ${{ secrets.OMNIROUTE_BASE_URL }}
          OMNIROUTE_API_KEY: ${{ secrets.OMNIROUTE_API_KEY }}
          OMNIROUTE_MODEL: ${{ secrets.OMNIROUTE_MODEL }}
        run: node scripts/whatsapp-digest-runner.js

  light-triggers:
    runs-on: ubuntu-latest
    steps:
      - name: wa-engine-monitor
        run: |
          curl -fsS -X POST "${{ secrets.WORKER_URL }}/api/trigger/wa-engine-monitor" -H "Authorization: Bearer ${{ secrets.SHARED_SECRET }}" || true
      - name: morning-queue-drain
        run: |
          curl -fsS -X POST "${{ secrets.WORKER_URL }}/api/trigger/morning-queue-drain" -H "Authorization: Bearer ${{ secrets.SHARED_SECRET }}" || true
      - name: orphaned-message-recovery
        run: |
          curl -fsS -X POST "${{ secrets.WORKER_URL }}/api/trigger/orphaned-message-recovery" -H "Authorization: Bearer ${{ secrets.SHARED_SECRET }}" || true
      - name: outbound-intent-recovery
        run: |
          curl -fsS -X POST "${{ secrets.WORKER_URL }}/api/trigger/outbound-intent-recovery" -H "Authorization: Bearer ${{ secrets.SHARED_SECRET }}" || true
      - name: sla-monitor
        run: |
          curl -fsS -X POST "${{ secrets.WORKER_URL }}/api/trigger/sla-monitor" -H "Authorization: Bearer ${{ secrets.SHARED_SECRET }}" || true
      - name: whatsapp-marketing
        run: |
          curl -fsS -X POST "${{ secrets.WORKER_URL }}/api/trigger/whatsapp-marketing" -H "Authorization: Bearer ${{ secrets.SHARED_SECRET }}" || true
      - name: notification-batcher
        run: |
          curl -fsS -X POST "${{ secrets.WORKER_URL }}/api/trigger/notification-batcher" -H "Authorization: Bearer ${{ secrets.SHARED_SECRET }}" || true