name: Agnes Relay (primary lane)
# On-demand/keepalive Agnes egress relay. Boots home-egress/proxy.js + joins
# the STATIC named tunnel, so the Worker URL never changes. Registers itself
# with the Worker (runId-aware CAS) and heartbeats; the gateway routes Agnes
# traffic via AGNES_PROXY_URL only while that flag is fresh.
#
# Rolling-restart safe: overlapping runs of this lane are allowed (NO
# concurrency cap) — the register endpoint refuses stale runIds, so the old
# run exits early instead of clobbering the new one. Zero-gap handoff.
# SSE streaming works (named tunnel, unlike trycloudflare quick tunnels).
on:
  workflow_dispatch:
    inputs:
      duration_min:
        description: "Relay window in minutes (job hard-caps at 360; keepalive uses 180)"
        default: "180"
      hostname:
        description: "Public relay hostname (named tunnel, static)"
        default: "egress-gh.apotza.com"

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Start Agnes proxy
        env:
          PROXY_SECRET: ${{ secrets.AGNES_RELAY_SECRET }}
          PORT: 8787
        run: |
          test -n "$PROXY_SECRET" || { echo "AGNES_RELAY_SECRET unset"; exit 1; }
          nohup node home-egress/proxy.js > /tmp/relay-proxy.log 2>&1 &
          sleep 3
          curl -s --max-time 10 http://127.0.0.1:8787/health || { echo "proxy failed to start"; cat /tmp/relay-proxy.log; exit 1; }

      - name: Install cloudflared
        run: |
          curl -fsSL -o /tmp/cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i /tmp/cloudflared.deb
          cloudflared --version

      - name: Join named tunnel + register ACTIVE
        env:
          TUNNEL_TOKEN: ${{ secrets.RELAY_TUNNEL_TOKEN }}
          WORKER_URL: ${{ secrets.WORKER_URL }}
          SHARED_SECRET: ${{ secrets.SHARED_SECRET }}
          HOSTNAME: ${{ inputs.hostname }}
          DURATION: ${{ inputs.duration_min }}
        run: |
          test -n "$TUNNEL_TOKEN" || { echo "RELAY_TUNNEL_TOKEN unset"; exit 1; }
          cloudflared tunnel --no-autoupdate run --token "$TUNNEL_TOKEN" > /tmp/relay-tunnel.log 2>&1 &
          for i in $(seq 1 24); do
            grep -q "Registered tunnel connection" /tmp/relay-tunnel.log && break
            sleep 5
          done
          grep "Registered tunnel connection" /tmp/relay-tunnel.log | head -n 2 \
            || { echo "tunnel never registered"; tail -n 20 /tmp/relay-tunnel.log; exit 1; }
          curl -s --max-time 20 "https://$HOSTNAME/health" || echo "public health not yet serving (tunnel propagating)"
          # Register only once the lane actually serves (runId CAS makes overlap safe)
          curl -s --max-time 20 -X POST "$WORKER_URL/api/runner/relay/register" \
            -H "Authorization: Bearer $SHARED_SECRET" \
            -H "Content-Type: application/json" \
            -d "{\"active\":true,\"lane\":\"primary\",\"runId\":\"$GITHUB_RUN_ID\",\"ttlSec\":21600,\"durationMin\":\"$DURATION\"}"

      - name: Heartbeat until window ends
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          SHARED_SECRET: ${{ secrets.SHARED_SECRET }}
          HOSTNAME: ${{ inputs.hostname }}
          DURATION: ${{ inputs.duration_min }}
        run: |
          END=$((SECONDS + DURATION * 60))
          while [ $SECONDS -lt $END ]; do
            P=$(curl -s -m 10 http://127.0.0.1:8787/health || echo DOWN)
            Q=$(curl -s -m 15 "https://$HOSTNAME/health" || echo DOWN)
            echo "$(date -u +%H:%M:%S) local=$P public=$Q"
            echo "--- relayed requests since last beat (proof of lane) ---"
            tail -n 20 /tmp/relay-proxy.log | grep -a "\[proxy\]" || echo "(no AI traffic via relay yet)"
            R=$(curl -s -m 20 -X POST "$WORKER_URL/api/runner/relay/register" \
              -H "Authorization: Bearer $SHARED_SECRET" \
              -H "Content-Type: application/json" \
              -d "{\"active\":true,\"lane\":\"primary\",\"runId\":\"$GITHUB_RUN_ID\",\"ttlSec\":21600,\"durationMin\":\"$DURATION\"}")
            echo "$R" | head -c 200; echo
            echo "$R" | grep -q superseded && { echo "SUPERSEDED by newer run — exiting early"; break; }
            sleep 300
          done
          echo RELAY-WINDOW-DONE

      - name: Deregister relay (OFF, only if still owner)
        if: always()
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          SHARED_SECRET: ${{ secrets.SHARED_SECRET }}
        run: |
          curl -s --max-time 20 -X POST "$WORKER_URL/api/runner/relay/register" \
            -H "Authorization: Bearer $SHARED_SECRET" \
            -H "Content-Type: application/json" \
            -d "{\"active\":false,\"lane\":\"primary\",\"runId\":\"$GITHUB_RUN_ID\"}" || true
