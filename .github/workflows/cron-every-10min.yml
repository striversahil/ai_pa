name: Cron - Every 10 min

on:
  # Dispatched ONLY by the Cloudflare Worker cron router (src/worker/cron.ts →
  # workflow_dispatch). Native schedule removed to avoid double-firing.
  # NOTE: the router skips this workflow 9PM-9AM IST (NeoDove-backed analysis
  # pauses overnight; the native in-worker refresh is the primary path).
  workflow_dispatch:

concurrency:
  group: cron-every-10min
  cancel-in-progress: true

jobs:
  neodove-today:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: neodove-report (today, intraday overwrite)
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          SHARED_SECRET: ${{ secrets.SHARED_SECRET }}
          NEODOVE_USER_IDS: ${{ secrets.NEODOVE_USER_IDS }}
        run: node scripts/neodove-report-runner.js --today
