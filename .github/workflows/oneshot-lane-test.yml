name: Oneshot - lane test (TEMPORARY, delete after run)
# Lane 3 of 3-way comparison: authenticated Agnes ping direct from runner.
# Lanes 1-2 (local direct, Cloudflare Worker) run outside this job.
on:
  workflow_dispatch:
jobs:
  lane-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Runner direct Agnes ping (real key, value NEVER echoed)
        env:
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          AI_KEYS: ${{ secrets.AI_KEYS }}
        run: |
          KEY="$AGNES_API_KEY"
          if [ -z "$KEY" ]; then
            KEY=$(echo "$AI_KEYS" | tr ',' '\n' | grep -o 'agnes:[^:]*' | head -n1 | cut -d: -f2)
          fi
          if [ -z "$KEY" ]; then echo "NO-KEY-CONFIGURED"; exit 1; fi
          echo "--- no-auth network baseline ---"
          for i in 1 2; do
            curl -o /dev/null -s -w "net$i: http=%{http_code} total=%{time_total}s ttfb=%{time_starttransfer}s\n" \
              --max-time 20 https://apihub.agnes-ai.com/v1/models
          done
          echo "--- authenticated inference (same prompt as other lanes) ---"
          for i in 1 2; do
            curl -s --max-time 60 -X POST https://apihub.agnes-ai.com/v1/chat/completions \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer $KEY" \
              -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/120" \
              -d '{"model":"agnes-3.0-flash","messages":[{"role":"user","content":"ping"}],"max_tokens":10}' \
              -w "\ninf$i: http=%{http_code} total=%{time_total}s ttfb=%{time_starttransfer}s\n" \
              | sed -E 's/sk-[A-Za-z0-9_.-]+/[REDACTED]/g' | head -c 500
            echo
          done
