name: Cron - Every 15 min

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  run-automations:
    runs-on: ubuntu-latest
    steps:
      - name: zoho-sent-analyzer (deterministic sync)
        run: |
          curl -fsS -X POST "${{ secrets.WORKER_URL }}/api/trigger/zoho-sent-analyzer" -H "Authorization: Bearer ${{ secrets.SHARED_SECRET }}" || true

      - name: zoho-sent-analyzer AI classification
        uses: actions/checkout@v4
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          SHARED_SECRET: ${{ secrets.SHARED_SECRET }}
          OMNIROUTE_BASE_URL: ${{ secrets.OMNIROUTE_BASE_URL }}
          OMNIROUTE_API_KEY: ${{ secrets.OMNIROUTE_API_KEY }}
          OMNIROUTE_MODEL: ${{ secrets.OMNIROUTE_MODEL }}
        run: node scripts/zoho-ai-classify.js