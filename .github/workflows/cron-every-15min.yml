name: Cron - Every 15 min

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Force reclassify ALL active estimates with the current model"
        type: boolean
        default: false

jobs:
  zoho-sent-analyzer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: zoho-sent-analyzer (full sync + AI on runner)
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          SHARED_SECRET: ${{ secrets.SHARED_SECRET }}
          OMNIROUTE_BASE_URL: ${{ secrets.OMNIROUTE_BASE_URL }}
          OMNIROUTE_API_KEY: ${{ secrets.OMNIROUTE_API_KEY }}
          OMNIROUTE_MODEL: ${{ secrets.OMNIROUTE_MODEL }}
          ZOHO_FORCE: ${{ github.event.inputs.force == 'true' && '1' || '0' }}
        run: node scripts/zoho-sent-runner.js