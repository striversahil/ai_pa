name: Cron - Every 15 min

on:
  # Dispatched ONLY by the Cloudflare Worker cron router (src/worker/cron.ts →
  # workflow_dispatch). Native schedule removed to avoid double-firing.
  workflow_dispatch:
    inputs:
      force:
        description: "Force reclassify ALL active estimates with the current model"
        type: boolean
        default: false

concurrency:
  group: cron-every-15min
  cancel-in-progress: true

jobs:
  zoho-sent-analyzer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: zoho-sent-analyzer (full sync + AI on runner)
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          SHARED_SECRET: ${{ secrets.SHARED_SECRET }}
          OMNIROUTE_BASE_URL: ${{ secrets.OMNIROUTE_BASE_URL }}
          OMNIROUTE_API_KEY: ${{ secrets.OMNIROUTE_API_KEY }}
          OMNIROUTE_MODEL: ${{ secrets.OMNIROUTE_MODEL }}
          GROQ_API_KEYS: ${{ secrets.GROQ_API_KEYS }}
          NEODOVE_AGENT_NAMES: Muskan
          ZOHO_FORCE: ${{ github.event.inputs.force == 'true' && '1' || '0' }}
        run: node scripts/zoho-sent-runner.js

  telecalling-effort-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: effort-sync (NeoDove call-log snapshots for snatch shield)
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          SHARED_SECRET: ${{ secrets.SHARED_SECRET }}
        run: node scripts/effort-sync-runner.js