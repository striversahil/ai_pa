name: Cron - Every 30 min

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

# Only one run at a time; cancel a stale in-progress run when a new one starts.
concurrency:
  group: cron-every-30min
  cancel-in-progress: true

jobs:
  email-brain-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: email-brain-index (sync + re-index on runner)
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          SHARED_SECRET: ${{ secrets.SHARED_SECRET }}
        run: node scripts/email-brain-index-runner.js

  light-triggers:
    runs-on: ubuntu-latest
    steps:
      - name: enterprise-operations-analytics
        run: |
          curl -fsS -X POST "${{ secrets.WORKER_URL }}/api/trigger/enterprise-operations-analytics?async=1" -H "Authorization: Bearer ${{ secrets.SHARED_SECRET }}" || true
      - name: telecalling-agent-analysis
        run: |
          curl -fsS -X POST "${{ secrets.WORKER_URL }}/api/trigger/telecalling-agent-analysis?async=1" -H "Authorization: Bearer ${{ secrets.SHARED_SECRET }}" || true
      - name: dpp-prices-dashboard
        run: |
          curl -fsS -X POST "${{ secrets.WORKER_URL }}/api/trigger/dpp-prices-dashboard?async=1" -H "Authorization: Bearer ${{ secrets.SHARED_SECRET }}" || true
      - name: telecalling-enquiry-to-dpp
        run: |
          curl -fsS -X POST "${{ secrets.WORKER_URL }}/api/trigger/telecalling-enquiry-to-dpp?async=1" -H "Authorization: Bearer ${{ secrets.SHARED_SECRET }}" || true
      # NOTE: no `telecalling` step here any more — estimate assignment rotates
      # ONCE daily at 08:00 IST via cron-daily-ist.yml (round-robin). Running it
      # every 30 minutes would needlessly re-deal the whole sent pool.
