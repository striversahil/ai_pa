name: ops-bulk-parse

# Vendor price-list file → staged BulkRows. NO `schedule:` block on purpose:
# fired on demand by the worker (POST /api/bulk-import/upload dispatches with
# batch_id) or manually from the Actions tab. Never re-add `schedule:`.
on:
  workflow_dispatch:
    inputs:
      batch_id:
        description: 'BulkBatch id to parse (empty = sweep all parsing batches)'
        required: false
        default: ''

jobs:
  parse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install poppler (PDF text extraction)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Parse price-list file(s)
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          SHARED_SECRET: ${{ secrets.SHARED_SECRET }}
          OPENROUTER_API_KEYS: ${{ secrets.OPENROUTER_API_KEYS }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: node scripts/bulk-parse-runner.js ${{ inputs.batch_id && format('--batch={0}', inputs.batch_id) }} --limit 5
