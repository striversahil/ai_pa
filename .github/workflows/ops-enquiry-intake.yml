name: Ops - Enquiry intake (event-driven)

on:
  # Event-driven ONLY: fired by kickIntakeNow() in the worker the moment an
  # enquiry is logged (POST /api/enquiries) or its free text is edited —
  # plus manual runs from the Actions tab. No schedule: block, no cron tick.
  # (The every-30min workflow carries the same job as a backstop for missed
  # dispatches.)
  workflow_dispatch:

# One run at a time; a newer log cancels a stale in-progress run (the next
# run re-pages the watermark queue, so nothing is lost).
concurrency:
  group: ops-enquiry-intake
  cancel-in-progress: true

jobs:
  enquiry-intake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: enquiry-intake (vision split + KYP slots + price-memory route)
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          SHARED_SECRET: ${{ secrets.SHARED_SECRET }}
          OPENROUTER_API_KEYS: ${{ secrets.OPENROUTER_API_KEYS }}
          OPENROUTER_FREE_MODELS: ${{ secrets.OPENROUTER_FREE_MODELS }}
          HF_API_KEY: ${{ secrets.HF_API_KEY }}
          PINECONE_HOST: ${{ secrets.PINECONE_HOST }}
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
        run: node scripts/enquiry-intake-runner.js --limit 10
