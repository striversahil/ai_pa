name: Ops - Enquiry intake (event-driven)

on:
  # Event-driven ONLY: fired by kickIntakeNow() in the worker the moment an
  # enquiry is logged (POST /api/enquiries) or its free text is edited —
  # plus manual runs from the Actions tab. No schedule: block, no cron tick.
  # (The every-30min workflow carries the same job as a backstop for missed
  # dispatches.)
  workflow_dispatch:

  # No concurrency block on purpose: overlapping runs are SAFE and wanted.
  # Runners claim disjoint enquiry sets via /claim (stale claims expire in
  # 10 min), so 5–6 simultaneous sales logs process in parallel instead of
  # queueing behind — or cancelling — each other.


jobs:
  enquiry-intake:
    if: false # DISABLED: intake now Worker-native via Agnes vision (src/modules/enquiries/vision-intake.ts), no GH Action — fast edge (<5s)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: enquiry-intake (vision split + verbatim items + price-memory route) — DISABLED
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          SHARED_SECRET: ${{ secrets.SHARED_SECRET }}
          OPENROUTER_API_KEYS: ${{ secrets.OPENROUTER_API_KEYS }}
          OPENROUTER_FREE_MODELS: ${{ secrets.OPENROUTER_FREE_MODELS }}
          HF_API_KEY: ${{ secrets.HF_API_KEY }}
          PINECONE_HOST: ${{ secrets.PINECONE_HOST }}
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
        run: node scripts/enquiry-intake-runner.js --limit 10
