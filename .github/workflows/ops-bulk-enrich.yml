name: ops-bulk-enrich

# Bulk-import AI pass (Steps 2+4, batched, reasoning-off). NO `schedule:`
# block on purpose: chained automatically after file parse (worker dispatches
# with batch_id) or manually from the Actions tab / dashboard enrich button.
# Never re-add `schedule:`.
on:
  workflow_dispatch:
    inputs:
      batch_id:
        description: 'BulkBatch id to enrich (empty = oldest unfinished batch)'
        required: false
        default: ''

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enrich staged rows
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          SHARED_SECRET: ${{ secrets.SHARED_SECRET }}
          OPENROUTER_API_KEYS: ${{ secrets.OPENROUTER_API_KEYS }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: node scripts/bulk-enrich-runner.js ${{ inputs.batch_id && format('--batch={0}', inputs.batch_id) }} --limit 150
