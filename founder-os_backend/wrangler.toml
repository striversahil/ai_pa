name = "founder-os-worker"
main = "dist-worker/worker.js"
compatibility_date = "2024-09-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "founder-os"
database_id = "45619af3-feab-48d3-b442-df18f4eadc9b"

[observability]
enabled = true

# Secrets (set via wrangler secret put):
#   SHARED_SECRET       — shared with GitHub Actions + local-runner
#   WA_ENGINE_API_KEY   — waengine.pro account key
#   LLM_API_KEY         — omniroute key
#   LLM_BASE_URL        — http://127.0.0.1:20128/v1 (local) or remote
#   LLM_MODEL           — groq/openai/gpt-oss-120b
#   GOOGLE_SERVICE_ACCOUNT_JSON — GSheets service account (if needed)