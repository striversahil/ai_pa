name = "founder-os-worker"
main = "dist-worker/worker.js"
compatibility_date = "2024-09-01"
compatibility_flags = ["nodejs_compat"]

[triggers]
crons = ["*/10 * * * *"]  # neodove-refresh (server-side; GH egress is blocked by NeoDove)

[[d1_databases]]
binding = "DB"
database_name = "waba-worker"
database_id = "45619af3-feab-48d3-b442-df18f4eadc9b"

[[kv_namespaces]]
binding = "CHAT_FILES"
id = "233eb9aa540f48a9a2e21b993252f1aa"

[[kv_namespaces]]
binding = "CACHE_KV"
id = "e30d130e7aab46daa5dadba451ddee4f"

[durable_objects]
bindings = [
  { name = "EVENT_HUB", class_name = "EventHub" },
  { name = "ASYNC_RUNNER", class_name = "AsyncTaskRunner" },
  { name = "CHAT_ROOM", class_name = "ChatRoomDO" },
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["EventHub"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["AsyncTaskRunner"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["ChatRoomDO"]

[observability]
enabled = true

# Secrets (set via wrangler secret put):
#   SHARED_SECRET       — shared with GitHub Actions + local-runner
#   WA_ENGINE_API_KEY   — waengine.pro account key
#   LLM_API_KEY         — omniroute key
#   LLM_BASE_URL        — http://127.0.0.1:20128/v1 (local) or remote
#   LLM_MODEL           — groq/openai/gpt-oss-120b
#   GOOGLE_SERVICE_ACCOUNT_JSON — GSheets service account (if needed)