version: '3.8'
services:
  postgres:
    image: postgres:16-alpine
    container_name: founder-os-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: founder
      POSTGRES_PASSWORD: founder_secret
      POSTGRES_DB: founder_os
      TZ: Asia/Kolkata
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - founder-os-net

  redis:
    image: redis:7-alpine
    container_name: founder-os-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --appendfsync everysec
    environment:
      TZ: Asia/Kolkata
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - founder-os-net

  backend:
    build: .
    container_name: founder-os-backend
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    environment:
      - NODE_ENV=development
      - TZ=Asia/Kolkata
      - DATABASE_URL=postgresql://founder:founder_secret@postgres:5432/founder_os
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - WA_ENGINE_API_KEY=${WA_ENGINE_API_KEY}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_BASE_URL=${LLM_BASE_URL}
      - LLM_MODEL=${LLM_MODEL}
      - EMAIL_IMAP_HOST=${EMAIL_IMAP_HOST}
      - EMAIL_IMAP_PORT=${EMAIL_IMAP_PORT}
      - EMAIL_USER=${EMAIL_USER}
      - EMAIL_PASSWORD=${EMAIL_PASSWORD}
      - NOTION_API_KEY=${NOTION_API_KEY}
      - NOTION_DATABASE_ID=${NOTION_DATABASE_ID}
      - MESSAGE_SLA_MINUTES=15
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL}
    ports:
      - "5000:3000"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - founder-os-net

  # Always-on WhatsApp webhook sink. WA Engine Pro POSTs every message event
  # here; the relay acks instantly, persists to a disk write-ahead log, and
  # forwards to the backend (host process on :5000). If the backend is down, the
  # burst is held on disk until it returns — no message is lost, and nothing
  # polls WA Engine Pro.
  webhook-relay:
    image: node:20-alpine
    container_name: webhook-relay
    restart: unless-stopped
    command: ["node", "/relay/relay.js"]
    environment:
      - RELAY_PORT=5099
      - RELAY_BACKEND=http://host.docker.internal:5000
      - RELAY_FORWARD_PATH=/api/whatsapp/webhook
      - RELAY_LOG_DIR=/runtime
      - TZ=Asia/Kolkata
    volumes:
      - ../webhook-relay:/relay
      - ./.runtime:/runtime
    extra_hosts:
      - "host.docker.internal:172.28.229.49"
    ports:
      - "5099:5099"
    networks:
      - founder-os-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5099/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgdata:
  redisdata:

networks:
  founder-os-net:
    driver: bridge