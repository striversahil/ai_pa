version: '3.8'
services:
  postgres:
    image: postgres:16-alpine
    container_name: founder-os-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: founder
      POSTGRES_PASSWORD: founder_secret
      POSTGRES_DB: founder_os
      TZ: Asia/Kolkata
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - founder-os-net

  redis:
    image: redis:7-alpine
    container_name: founder-os-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --appendfsync everysec
    environment:
      TZ: Asia/Kolkata
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - founder-os-net

  backend:
    build: .
    container_name: founder-os-backend
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    environment:
      - NODE_ENV=development
      - TZ=Asia/Kolkata
      - DATABASE_URL=postgresql://founder:founder_secret@postgres:5432/founder_os
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - WAHA_API_URL=http://waha:3002
      - WAHA_API_KEY=MyLocalSecretKey!
      - WAHA_SESSION_NAME=default
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_BASE_URL=${LLM_BASE_URL}
      - LLM_MODEL=${LLM_MODEL}
      - EMAIL_IMAP_HOST=${EMAIL_IMAP_HOST}
      - EMAIL_IMAP_PORT=${EMAIL_IMAP_PORT}
      - EMAIL_USER=${EMAIL_USER}
      - EMAIL_PASSWORD=${EMAIL_PASSWORD}
      - NOTION_API_KEY=${NOTION_API_KEY}
      - NOTION_DATABASE_ID=${NOTION_DATABASE_ID}
      - MESSAGE_SLA_MINUTES=15
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL}
    ports:
      - "5000:3000"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - founder-os-net

  waha:
    image: devlikeapro/waha:latest-2026.7.2
    container_name: waha
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      - WAHA_ENGINE=WEBJS
      - WAHA_PRINT_QR=true
      - WAHA_API_KEY=MyLocalSecretKey!
      - TZ=Asia/Kolkata
      - WAHA_WEBHOOK_CONCURRENCY=5
      - WAHA_WEBJS_PUPPETER_ARGS=--no-sandbox --disable-setuid-sandbox --disable-dev-shm-usage --disable-blink-features=AutomationControlled --use-gl=angle --use-angle=swiftshader-webgl --enable-webgl --ignore-gpu-blocklist --enable-unsafe-swiftshader
      - WHATSAPP_HOOK_URL=http://host.docker.internal:5099/api/whatsapp/webhook
      - WHATSAPP_HOOK_EVENTS=message
      - WHATSAPP_HOOK_RETRIES_POLICY=constant
      - WHATSAPP_HOOK_RETRIES_DELAY_SECONDS=2
      - WHATSAPP_HOOK_RETRIES_ATTEMPTS=120
    volumes:
      # Named volume (NOT a host bind mount). A host bind mount through Docker
      # Desktop on WSL2 intermittently falls back to a tmpfs at container start
      # (the docker-desktop-bind-mounts shim isn't ready), which hides the saved
      # session and yields "Session not found" / /api/sessions = []. A named
      # volume lives natively in the vm and survives every restart. See
      # WHATSAPP_FLOW.md §10.3.
      - waha_sessions:/app/.sessions
    extra_hosts:
      - "host.docker.internal:172.28.229.49"
    ports:
      - "127.0.0.1:3002:3000"
    networks:
      - founder-os-net
    mem_limit: 2g
    cpus: 1
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Always-on WhatsApp webhook sink. WAHA POSTs every message here; the relay
  # acks instantly, persists to a disk write-ahead log, and forwards to the
  # backend (host process on :5000). If the backend is down, the burst is held
  # on disk until it returns — no message is lost, and nothing polls WAHA.
  webhook-relay:
    image: node:20-alpine
    container_name: webhook-relay
    restart: unless-stopped
    command: ["node", "/relay/relay.js"]
    environment:
      - RELAY_PORT=5099
      - RELAY_BACKEND=http://host.docker.internal:5000
      - RELAY_FORWARD_PATH=/api/whatsapp/webhook
      - RELAY_LOG_DIR=/runtime
      - TZ=Asia/Kolkata
    volumes:
      - ../webhook-relay:/relay
      - ./.runtime:/runtime
    extra_hosts:
      - "host.docker.internal:172.28.229.49"
    ports:
      - "5099:5099"
    networks:
      - founder-os-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5099/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgdata:
  redisdata:
  waha_sessions:

networks:
  founder-os-net:
    driver: bridge