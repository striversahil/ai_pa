version: '3.8'
services:
  postgres:
    image: postgres:16-alpine
    container_name: founder-os-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: founder
      POSTGRES_PASSWORD: founder_secret
      POSTGRES_DB: founder_os
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - founder-os-net

  redis:
    image: redis:7-alpine
    container_name: founder-os-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - founder-os-net

  backend:
    build: .
    container_name: founder-os-backend
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://founder:founder_secret@postgres:5432/founder_os
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - WAHA_API_URL=http://waha:3002
      - WAHA_API_KEY=MyLocalSecretKey!
      - WAHA_SESSION_NAME=default
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_BASE_URL=${LLM_BASE_URL}
      - LLM_MODEL=${LLM_MODEL}
      - EMAIL_IMAP_HOST=${EMAIL_IMAP_HOST}
      - EMAIL_IMAP_PORT=${EMAIL_IMAP_PORT}
      - EMAIL_USER=${EMAIL_USER}
      - EMAIL_PASSWORD=${EMAIL_PASSWORD}
      - NOTION_API_KEY=${NOTION_API_KEY}
      - NOTION_DATABASE_ID=${NOTION_DATABASE_ID}
      - MESSAGE_SLA_MINUTES=15
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL}
    ports:
      - "5000:3000"
    networks:
      - founder-os-net

  waha:
    image: devlikeapro/waha:latest
    container_name: waha
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      - WAHA_ENGINE=WEBJS
      - WAHA_PRINT_QR=true
      - WAHA_API_KEY=MyLocalSecretKey!
      - TZ=Asia/Kolkata
      - WAHA_WEBHOOK_CONCURRENCY=5
      - WAHA_WEBJS_PUPPETER_ARGS=--no-sandbox --disable-setuid-sandbox --disable-dev-shm-usage --disable-blink-features=AutomationControlled --use-gl=angle --use-angle=swiftshader-webgl --enable-webgl --ignore-gpu-blocklist --enable-unsafe-swiftshader
      - WHATSAPP_HOOK_URL=http://host.docker.internal:5000/api/whatsapp/webhook
      - WHATSAPP_HOOK_EVENTS=message
    volumes:
      - ./waha_sessions:/app/.sessions
    extra_hosts:
      - "host.docker.internal:172.28.229.49"
    ports:
      - "127.0.0.1:3002:3000"
    networks:
      - founder-os-net
    mem_limit: 2g
    cpus: 1

volumes:
  pgdata:

networks:
  founder-os-net:
    driver: bridge